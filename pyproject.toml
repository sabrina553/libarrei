[project]
name = "libarrei"
version = "0.1.0"
description = "Book metadata engine: gathers Goodreads, Hardcover, Open Library and more into one provenance-tracked record."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.164.0",
    "gql[aiohttp]>=4.4.0",
    "pycountry>=26.2.16",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
libarrei = "libarrei.cli:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=9.2.0",
]
